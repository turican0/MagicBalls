name: Build GDExtension, Godot Export & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# ─────────────────────────────────────────────────────────────
# JOBS – Windows, Linux a Android běží paralelně,
#         release job počká na všechny tři.
# ─────────────────────────────────────────────────────────────
jobs:

  # ───────────────────────────────────────────
  # 1) WINDOWS – C++ (CMake) + Godot export
  # ───────────────────────────────────────────
  build-windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Build C++ Library (Debug & Release)
        shell: pwsh
        run: |
          cmake -B build-cpp-release -S gitextension/godot-cpp-template -DCMAKE_BUILD_TYPE=Release -DLIBNAME="MagicBalls"
          cmake --build build-cpp-release --config Release

          cmake -B build-cpp-debug -S gitextension/godot-cpp-template -DCMAKE_BUILD_TYPE=Debug -DLIBNAME="MagicBalls"
          cmake --build build-cpp-debug --config Debug

      - name: Rename DLLs to EXTENSION-NAME
        shell: pwsh
        run: |
          $binDir = "gitextension/godot-cpp-template/bin/windows"

          Write-Host "=== DLL před přejmenováním ==="
          Get-ChildItem -Path $binDir -Filter "*.dll" | Select-Object Name

          Get-ChildItem -Path $binDir -Filter "MagicBalls*.dll" | ForEach-Object {
            $newName = $_.Name -replace '^MagicBalls', 'EXTENSION-NAME'
            Rename-Item -Path $_.FullName -NewName $newName -Force
            Write-Host "Přejmenováno: $($_.Name) → $newName"
          }

          Write-Host "=== DLL po přejmenování ==="
          Get-ChildItem -Path $binDir -Filter "*.dll" | Select-Object Name

          $expected = @(
            "$binDir\EXTENSION-NAME.windows.template_debug.x86_64.debug.dll",
            "$binDir\EXTENSION-NAME.windows.template_debug.x86_64.dll"
          )
          foreach ($f in $expected) {
            if (Test-Path $f) { Write-Host "OK: $f" }
            else              { Write-Error "CHYBI: $f"; exit 1 }
          }

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.1
          use-dotnet: false
          include-templates: true

      - name: Install Blender
        shell: pwsh
        run: |
          $url = "https://download.blender.org/release/Blender5.1/blender-5.1.0-windows-x64.msi"
          Invoke-WebRequest -Uri $url -OutFile "blender.msi"
          Start-Process msiexec -ArgumentList "/i blender.msi /quiet /norestart" -Wait
          $blenderPath = "C:\Program Files\Blender Foundation\Blender 5.1\blender.exe"
          Write-Host "Blender: $blenderPath"
          echo "BLENDER_PATH=$blenderPath" >> $env:GITHUB_ENV

      - name: Import Godot project
        shell: pwsh
        run: |
          $godotPath = $env:GODOT
          echo "GODOT_CONSOLE=$godotPath" >> $env:GITHUB_ENV
          $proj = "godot-code"

          $settingsPath = "C:\Users\runneradmin\AppData\Roaming\Godot\editor_settings-4.tres"
          $blenderDir = (Split-Path $env:BLENDER_PATH) -replace '\\', '/'
          New-Item -ItemType Directory -Force -Path (Split-Path $settingsPath)
          Set-Content $settingsPath -Encoding UTF8 -Value "[gd_resource type=""EditorSettings"" format=3]`n`n[resource]`nfilesystem/import/blender/blender3_path = ""$blenderDir"""
          Write-Host "Editor settings vytvořeny s Blender cestou: $blenderDir"

          Write-Host "=== Spouštím import ==="
          $proc = Start-Process -FilePath $godotPath -ArgumentList "--headless --path $proj --editor --quit-after 120000" -NoNewWindow -Wait -PassThru -RedirectStandardOutput "import_stdout.txt" -RedirectStandardError "import_stderr.txt"
          Write-Host "Exit code: $($proc.ExitCode)"
          Get-Content "import_stdout.txt" -ErrorAction SilentlyContinue
          Get-Content "import_stderr.txt" -ErrorAction SilentlyContinue

          $importedDir = "$proj/.godot/imported"
          if (Test-Path $importedDir) {
            $count = (Get-ChildItem $importedDir -Recurse -File).Count
            Write-Host "Importováno souborů: $count"
          } else {
            Write-Error "Složka .godot/imported nevznikla!"
            exit 1
          }

      - name: Godot Export
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "exports/debug"
          New-Item -ItemType Directory -Force -Path "exports/release"

          $godot      = $env:GODOT_CONSOLE
          $workspace  = "${{ github.workspace }}"
          $debugExe   = "$workspace\exports\debug\MagicBalls-Debug.exe"
          $releaseExe = "$workspace\exports\release\MagicBalls.exe"

          Write-Host "=== DEBUG export ==="
          $proc = Start-Process -FilePath $godot -ArgumentList "--headless --verbose --path godot-code --export-debug MagicBalls $debugExe" -NoNewWindow -Wait -PassThru -RedirectStandardOutput "debug_stdout.txt" -RedirectStandardError "debug_stderr.txt"
          Write-Host "Exit code: $($proc.ExitCode)"
          if (Test-Path "debug_stdout.txt") { Get-Content "debug_stdout.txt" }
          if (Test-Path "debug_stderr.txt") { Get-Content "debug_stderr.txt" }
          if ($proc.ExitCode -ne 0) { exit 1 }
          if (-not (Test-Path $debugExe)) { Write-Error "Debug exe chybi!"; exit 1 }

          Write-Host "=== RELEASE export ==="
          $proc2 = Start-Process -FilePath $godot -ArgumentList "--headless --verbose --path godot-code --export-release MagicBalls $releaseExe" -NoNewWindow -Wait -PassThru -RedirectStandardOutput "release_stdout.txt" -RedirectStandardError "release_stderr.txt"
          Write-Host "Exit code: $($proc2.ExitCode)"
          if (Test-Path "release_stdout.txt") { Get-Content "release_stdout.txt" }
          if (Test-Path "release_stderr.txt") { Get-Content "release_stderr.txt" }
          if ($proc2.ExitCode -ne 0) { exit 1 }
          if (-not (Test-Path $releaseExe)) { Write-Error "Release exe chybi!"; exit 1 }

          Write-Host "=== Obsah exports/ ==="
          Get-ChildItem -Recurse "exports/"

      - name: Package Artifacts
        shell: pwsh
        run: |
          $tagName    = "${{ github.ref_name }}"
          $debugZip   = "exports\MagicBalls-$tagName-Windows-Debug.zip"
          $releaseZip = "exports\MagicBalls-$tagName-Windows-Release.zip"

          Copy-Item "scripts/editor.bat"             "exports/debug/"   -ErrorAction SilentlyContinue
          Copy-Item "scripts/removeUserMBFolder.bat" "exports/debug/"   -ErrorAction SilentlyContinue
          Copy-Item "scripts/editor.bat"             "exports/release/" -ErrorAction SilentlyContinue
          Copy-Item "scripts/removeUserMBFolder.bat" "exports/release/" -ErrorAction SilentlyContinue

          $binDir = "gitextension/godot-cpp-template/bin/windows"
          Copy-Item "$binDir\EXTENSION-NAME.windows.template_debug.x86_64.dll"       "exports/release/"
          Copy-Item "$binDir\EXTENSION-NAME.windows.template_debug.x86_64.debug.dll" "exports/debug/"

          & "C:\Program Files\7-Zip\7z.exe" a "$debugZip"   ".\exports\debug\*"
          & "C:\Program Files\7-Zip\7z.exe" a "$releaseZip" ".\exports\release\*"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-zips
          path: exports/*.zip


  # ───────────────────────────────────────────
  # 2) LINUX – C++ (CMake) + Godot export
  # ───────────────────────────────────────────
  build-linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            gcc g++ \
            libx11-dev libxcursor-dev libxinerama-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libasound2-dev libpulse-dev \
            libfreetype6-dev

      - name: Build C++ Library (Debug & Release)
        run: |
          # GCC 13 (ubuntu-latest) je prísnější na C++ standardy:
          # - netransitivne includuje <atomic> a <cmath>
          # - lib9660.h (systémová) obsahuje flexible array member který GCC 13 odmítá
          # Fix: použít GCC 12 + -Wno-error pro potlačení non-fatal warningů třetích stran
          # -include atomic: GCC 13 (ubuntu-latest) uz netransitivne includuje
          # <atomic>, coz zpusobuje "incomplete type std::atomic<bool>"
          EXTRA_FLAGS="-include atomic -include cmath"

          cmake -B build-cpp-release -S gitextension/godot-cpp-template \
            -DCMAKE_BUILD_TYPE=Release -DLIBNAME="MagicBalls" \
            -DCMAKE_CXX_FLAGS="$EXTRA_FLAGS" \
            -GNinja
          ninja -C build-cpp-release

          cmake -B build-cpp-debug -S gitextension/godot-cpp-template \
            -DCMAKE_BUILD_TYPE=Debug -DLIBNAME="MagicBalls" \
            -DCMAKE_CXX_FLAGS="$EXTRA_FLAGS" \
            -GNinja
          ninja -C build-cpp-debug

      - name: Rename .so files to EXTENSION-NAME
        run: |
          binDir="gitextension/godot-cpp-template/bin/linux"
          echo "=== .so před přejmenováním ==="
          ls "$binDir"/*.so 2>/dev/null || true

          for f in "$binDir"/MagicBalls*.so; do
            [ -e "$f" ] || continue
            newName=$(basename "$f" | sed 's/^MagicBalls/EXTENSION-NAME/')
            mv "$f" "$binDir/$newName"
            echo "Přejmenováno: $(basename $f) → $newName"
          done

          echo "=== .so po přejmenování ==="
          ls "$binDir"/*.so 2>/dev/null || true

      - name: Install Godot + export templates
        run: |
          GODOT_VERSION="4.6.1"
          GODOT_FILENAME="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          TEMPLATES_FILENAME="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${GODOT_FILENAME}.zip"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${TEMPLATES_FILENAME}"

          unzip -q "${GODOT_FILENAME}.zip"
          chmod +x "${GODOT_FILENAME}"
          sudo mv "${GODOT_FILENAME}" /usr/local/bin/godot

          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q "${TEMPLATES_FILENAME}" -d /tmp/templates
          mv /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Install Blender
        run: |
          BLENDER_VERSION="5.1.0"
          wget -q "https://download.blender.org/release/Blender5.1/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          tar -xf "blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          BLENDER_PATH="$(pwd)/blender-${BLENDER_VERSION}-linux-x64/blender"
          echo "BLENDER_PATH=$BLENDER_PATH" >> $GITHUB_ENV

      - name: Import Godot project
        run: |
          SETTINGS_DIR="$HOME/.config/godot"
          mkdir -p "$SETTINGS_DIR"
          BLENDER_DIR=$(dirname "$BLENDER_PATH")
          cat > "$SETTINGS_DIR/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          filesystem/import/blender/blender3_path = "$BLENDER_DIR"
          EOF

          echo "=== Spouštím import ==="
          timeout 120 godot --headless --path godot-code --editor --quit-after 120000 \
            > import_stdout.txt 2> import_stderr.txt || true
          cat import_stdout.txt || true
          cat import_stderr.txt || true

          if [ -d "godot-code/.godot/imported" ]; then
            COUNT=$(find "godot-code/.godot/imported" -type f | wc -l)
            echo "Importováno souborů: $COUNT"
          else
            echo "ERROR: .godot/imported nevznikla!" && exit 1
          fi

      - name: Godot Export (Release)
        run: |
          mkdir -p exports/release
          RELEASE_BIN="${{ github.workspace }}/exports/release/MagicBalls.x86_64"

          echo "=== RELEASE export ==="
          godot --headless --verbose --path godot-code \
            --export-release MagicBalls "$RELEASE_BIN" \
            > release_stdout.txt 2> release_stderr.txt
          cat release_stdout.txt || true
          cat release_stderr.txt || true

          [ -f "$RELEASE_BIN" ] || { echo "ERROR: Linux binary chybí!"; exit 1; }

          echo "=== Obsah exports/ ==="
          find exports/ -type f

      - name: Package Artifacts
        run: |
          TAG="${{ github.ref_name }}"
          cp gitextension/godot-cpp-template/bin/linux/EXTENSION-NAME.linux.template_release.x86_64.so \
            exports/release/ 2>/dev/null || true

          tar -czf "exports/MagicBalls-${TAG}-Linux-Release.tar.gz" -C exports/release .

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-tarballs
          path: exports/*.tar.gz


  # ───────────────────────────────────────────
  # 3) ANDROID – C++ (CMake) + Godot export (release APK)
  # ───────────────────────────────────────────
  build-android:
    name: Android (release APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK r23c
        run: |
          sdkmanager --install "ndk;23.2.8568313"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/23.2.8568313" >> $GITHUB_ENV

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Build C++ Library for Android (arm64-v8a + x86_64)
        run: |
          for ABI in arm64-v8a x86_64; do
            cmake -B "build-android-$ABI" \
              -S gitextension/godot-cpp-template \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" \
              -DANDROID_PLATFORM=android-24 \
              -DANDROID_CPP_FEATURES="exceptions rtti" \
              -DCMAKE_BUILD_TYPE=Release \
              -DLIBNAME="MagicBalls" \
              -DCMAKE_CXX_FLAGS="-include cmath" \
              -DCMAKE_EXE_LINKER_FLAGS="-lm" \
              -GNinja
            ninja -C "build-android-$ABI"
          done

      - name: Rename .so files to EXTENSION-NAME
        run: |
          for ABI in arm64-v8a x86_64; do
            binDir="gitextension/godot-cpp-template/bin/android/$ABI"
            for f in "$binDir"/MagicBalls*.so; do
              [ -e "$f" ] || continue
              newName=$(basename "$f" | sed 's/^MagicBalls/EXTENSION-NAME/')
              mv "$f" "$binDir/$newName"
              echo "Přejmenováno: $(basename $f) → $newName [$ABI]"
            done
          done

      - name: Install Godot + Android export templates
        run: |
          GODOT_VERSION="4.6.1"
          GODOT_FILENAME="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          TEMPLATES_FILENAME="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${GODOT_FILENAME}.zip"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${TEMPLATES_FILENAME}"

          unzip -q "${GODOT_FILENAME}.zip"
          chmod +x "${GODOT_FILENAME}"
          sudo mv "${GODOT_FILENAME}" /usr/local/bin/godot

          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q "${TEMPLATES_FILENAME}" -d /tmp/templates
          mv /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Setup Android keystore (release signing)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          echo "KEYSTORE_PATH=$(pwd)/keystore.jks" >> $GITHUB_ENV

          # Godot editor settings pro Android SDK
          SETTINGS_DIR="$HOME/.config/godot"
          mkdir -p "$SETTINGS_DIR"
          cat > "$SETTINGS_DIR/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          EOF

      - name: Import Godot project
        run: |
          timeout 120 godot --headless --path godot-code --editor --quit-after 120000 \
            > import_stdout.txt 2> import_stderr.txt || true
          cat import_stdout.txt || true
          cat import_stderr.txt || true

          if [ -d "godot-code/.godot/imported" ]; then
            COUNT=$(find "godot-code/.godot/imported" -type f | wc -l)
            echo "Importováno souborů: $COUNT"
          else
            echo "ERROR: .godot/imported nevznikla!" && exit 1
          fi

      - name: Godot Export – Android Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p exports/android
          TAG="${{ github.ref_name }}"
          APK_PATH="${{ github.workspace }}/exports/android/MagicBalls-${TAG}-Android-Release.apk"

          echo "=== ANDROID RELEASE export ==="
          godot --headless --verbose --path godot-code \
            --export-release Android "$APK_PATH" \
            > android_stdout.txt 2> android_stderr.txt
          cat android_stdout.txt || true
          cat android_stderr.txt || true

          [ -f "$APK_PATH" ] || { echo "ERROR: APK chybí!"; exit 1; }
          echo "=== APK sestaveno: $APK_PATH ==="

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: exports/android/*.apk


  # ───────────────────────────────────────────
  # 4) RELEASE – čeká na všechny 3 buildy,
  #              generuje changelog přes Gemini
  #              a vytvoří GitHub Release
  # ───────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-linux
      - build-android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: List dist
        run: find dist/ -type f

      - name: Generate Changelog via Gemini
        id: changelog
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -z "$PREV_TAG" ]; then
            GIT_LOG=$(git log --oneline --no-merges | head -30)
          else
            GIT_LOG=$(git log "${PREV_TAG}..HEAD" --oneline --no-merges)
          fi

          [ -z "$GIT_LOG" ] && GIT_LOG="No commits since last release."

          echo "=== Git log pro changelog ==="
          echo "$GIT_LOG"

          PROMPT="You are a concise release notes writer. Based on the following git commit log, write a short and clear changelog in bullet points (max 10 bullets). Group related changes if possible. Use plain English, no fluff. Commits:\n\n${GIT_LOG}"

          RESPONSE=$(curl -s \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"contents\":[{\"parts\":[{\"text\":$(echo "$PROMPT" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')}]}]}")

          CHANGELOG=$(echo "$RESPONSE" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          print(data['candidates'][0]['content']['parts'][0]['text'])
          ")

          echo "=== Vygenerovaný changelog ==="
          echo "$CHANGELOG"

          {
            echo "CHANGELOG<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "MagicBalls ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          body: |
            ## 🎮 MagicBalls ${{ github.ref_name }}

            ${{ steps.changelog.outputs.CHANGELOG }}

            ---
            | Platforma | Soubor |
            |-----------|--------|
            | 🪟 Windows Debug | `MagicBalls-${{ github.ref_name }}-Windows-Debug.zip` |
            | 🪟 Windows Release | `MagicBalls-${{ github.ref_name }}-Windows-Release.zip` |
            | 🐧 Linux x86_64 | `MagicBalls-${{ github.ref_name }}-Linux-Release.tar.gz` |
            | 🤖 Android | `MagicBalls-${{ github.ref_name }}-Android-Release.apk` |
          files: |
            dist/windows-zips/*.zip
            dist/linux-tarballs/*.tar.gz
            dist/android-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}