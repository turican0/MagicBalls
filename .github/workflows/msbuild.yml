name: Build GDExtension, Godot Export & Release
on:
  push:
    tags:
      - 'v*'
jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 1. ENVIRONMENT SETUP
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      # 2. COMPILE C++ LIBRARY
      - name: Build C++ Library (Debug & Release)
        shell: pwsh
        run: |
          cmake -B build-cpp-release -S gitextension/godot-cpp-template -DCMAKE_BUILD_TYPE=Release -DLIBNAME="MagicBalls"
          cmake --build build-cpp-release --config Release

          cmake -B build-cpp-debug -S gitextension/godot-cpp-template -DCMAKE_BUILD_TYPE=Debug -DLIBNAME="MagicBalls"
          cmake --build build-cpp-debug --config Debug

      # 3. COPY DLL INTO GODOT PROJECT (so Godot can find it during export)
      - name: Copy DLLs into Godot project
        shell: pwsh
        run: |
          # CMake outputs DLLs into gitextension/godot-cpp-template/bin/
          $releaseDll = Get-ChildItem -Path "gitextension/godot-cpp-template/bin" -Recurse -Filter "MagicBalls*.dll" | Where-Object { $_.Name -notlike "*debug*" } | Select-Object -First 1
          $debugDll   = Get-ChildItem -Path "gitextension/godot-cpp-template/bin" -Recurse -Filter "MagicBalls*.dll" | Where-Object { $_.Name -like "*debug*" }   | Select-Object -First 1

          Write-Host "Release DLL: $($releaseDll.FullName)"
          Write-Host "Debug DLL:   $($debugDll.FullName)"

          if (-not $releaseDll) { Write-Error "Release DLL not found!"; exit 1 }
          if (-not $debugDll)   { Write-Error "Debug DLL not found!";   exit 1 }

          # Copy into the Godot project's bin folder (match your .gdextension file path)
          New-Item -ItemType Directory -Force -Path "godot-code/bin"
          Copy-Item $releaseDll.FullName "godot-code/bin/"
          Copy-Item $debugDll.FullName   "godot-code/bin/"

      # 4. SETUP GODOT
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.2.1

      # 5. EXPORT GODOT PROJECT
      - name: Godot Export
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "exports/debug"
          New-Item -ItemType Directory -Force -Path "exports/release"

          godot --headless --path godot-code --export-debug   "Windows Desktop" ../exports/debug/MagicBalls-Debug.exe
          godot --headless --path godot-code --export-release "Windows Desktop" ../exports/release/MagicBalls.exe

          # Fail loudly if the exe wasn't produced
          if (-not (Test-Path "exports/debug/MagicBalls-Debug.exe")) {
            Write-Error "DEBUG export failed – exe not found!"
            exit 1
          }
          if (-not (Test-Path "exports/release/MagicBalls.exe")) {
            Write-Error "RELEASE export failed – exe not found!"
            exit 1
          }

      # 6. PREPARE RELEASE PACKAGES
      - name: Package Artifacts with Tag Name
        shell: pwsh
        run: |
          $tagName    = "${{ github.ref_name }}"
          $debugZip   = "MagicBalls-$tagName-Windows-Debug.zip"
          $releaseZip = "MagicBalls-$tagName-Windows-Release.zip"

          # Copy .bat files
          Copy-Item "scripts/editor.bat"             "exports/debug/"
          Copy-Item "scripts/removeUserMBFolder.bat" "exports/debug/"
          Copy-Item "scripts/editor.bat"             "exports/release/"
          Copy-Item "scripts/removeUserMBFolder.bat" "exports/release/"

          # Copy DLLs directly into the zip folders too (belt-and-suspenders)
          $releaseDll = Get-ChildItem -Path "gitextension/godot-cpp-template/bin" -Recurse -Filter "MagicBalls*.dll" | Where-Object { $_.Name -notlike "*debug*" } | Select-Object -First 1
          $debugDll   = Get-ChildItem -Path "gitextension/godot-cpp-template/bin" -Recurse -Filter "MagicBalls*.dll" | Where-Object { $_.Name -like "*debug*" }   | Select-Object -First 1

          if (-not $releaseDll) { Write-Error "Release DLL not found!"; exit 1 }
          if (-not $debugDll)   { Write-Error "Debug DLL not found!";   exit 1 }

          Copy-Item $releaseDll.FullName "exports/release/"
          Copy-Item $debugDll.FullName   "exports/debug/"

          Compress-Archive -Path "exports/debug/*"   -DestinationPath "exports/$debugZip"
          Compress-Archive -Path "exports/release/*" -DestinationPath "exports/$releaseZip"

      # 7. CREATE GITHUB RELEASE
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: exports/*.zip
          body: "Automated build for MagicBalls version ${{ github.ref_name }}."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}