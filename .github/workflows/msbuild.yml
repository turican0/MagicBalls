name: Build GDExtension, Godot Export & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Build C++ Library (Debug & Release)
        shell: pwsh
        run: |
          cmake -B build-cpp-release -S gitextension/godot-cpp-template -DCMAKE_BUILD_TYPE=Release -DLIBNAME="MagicBalls"
          cmake --build build-cpp-release --config Release

          cmake -B build-cpp-debug -S gitextension/godot-cpp-template -DCMAKE_BUILD_TYPE=Debug -DLIBNAME="MagicBalls"
          cmake --build build-cpp-debug --config Debug

      - name: Rename DLLs to EXTENSION-NAME
        shell: pwsh
        run: |
          $binDir = "gitextension/godot-cpp-template/bin/windows"

          Get-ChildItem -Path $binDir -Filter "MagicBalls*.dll" | ForEach-Object {
            $newName = $_.Name -replace '^MagicBalls', 'EXTENSION-NAME'
            Rename-Item -Path $_.FullName -NewName $newName -Force
            Write-Host "Přejmenováno: $($_.Name) → $newName"
          }

      - name: Copy DLLs into Godot project
        shell: pwsh
        run: |
          $releaseDll = Get-ChildItem -Path "gitextension/godot-cpp-template/bin" -Recurse -Filter "EXTENSION-NAME*.dll" | Where-Object { $_.Name -notlike "*.debug.dll" } | Select-Object -First 1
          $debugDll   = Get-ChildItem -Path "gitextension/godot-cpp-template/bin" -Recurse -Filter "EXTENSION-NAME*.dll" | Where-Object { $_.Name -like "*.debug.dll" }   | Select-Object -First 1

          Write-Host "Release DLL: $($releaseDll.FullName)"
          Write-Host "Debug DLL:   $($debugDll.FullName)"

          if (-not $releaseDll) { Write-Error "Release DLL not found!"; exit 1 }
          if (-not $debugDll)   { Write-Error "Debug DLL not found!";   exit 1 }

          New-Item -ItemType Directory -Force -Path "godot-code/bin"
          Copy-Item $releaseDll.FullName "godot-code/bin/"
          Copy-Item $debugDll.FullName   "godot-code/bin/"

      # ↓ OPRAVA 1: use-dotnet: false → stáhne standard Godot, ne Mono
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.2.1
          use-dotnet: false
          include-templates: true

      - name: Initialize Godot project
        shell: pwsh
        run: |
          # ↓ OPRAVA 2: $env:GODOT místo holého 'godot'
          & $env:GODOT --headless --path godot-code --editor --quit
          Start-Sleep -Seconds 8
          Write-Host "Godot version:"
          & $env:GODOT --version

      - name: Godot Export
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "exports/debug"
          New-Item -ItemType Directory -Force -Path "exports/release"

          $workspace  = "${{ github.workspace }}"
          $debugExe   = "$workspace\exports\debug\MagicBalls-Debug.exe"
          $releaseExe = "$workspace\exports\release\MagicBalls.exe"
          # ↓ OPRAVA 2: $env:GODOT místo holého 'godot'
          $godot      = $env:GODOT

          Write-Host "Godot binary: $godot"
          & $godot --version

          Write-Host "=== DEBUG export ==="
          & $godot --headless --verbose --path godot-code --export-debug "MagicBalls" "$debugExe"
          Write-Host "Exit code: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit 1 }

          Write-Host "=== RELEASE export ==="
          & $godot --headless --verbose --path godot-code --export-release "MagicBalls" "$releaseExe"
          Write-Host "Exit code: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit 1 }

          if (-not (Test-Path $debugExe))   { Write-Error "Debug exe chybí!";   exit 1 }
          if (-not (Test-Path $releaseExe)) { Write-Error "Release exe chybí!"; exit 1 }

          Write-Host "=== Obsah exports/ ==="
          Get-ChildItem -Recurse "exports/"

      - name: Package Artifacts with Tag Name
        shell: pwsh
        run: |
          $tagName    = "${{ github.ref_name }}"
          $debugZip   = "MagicBalls-$tagName-Windows-Debug.zip"
          $releaseZip = "MagicBalls-$tagName-Windows-Release.zip"

          Copy-Item "scripts/editor.bat"             "exports/debug/"   -ErrorAction SilentlyContinue
          Copy-Item "scripts/removeUserMBFolder.bat" "exports/debug/"   -ErrorAction SilentlyContinue
          Copy-Item "scripts/editor.bat"             "exports/release/" -ErrorAction SilentlyContinue
          Copy-Item "scripts/removeUserMBFolder.bat" "exports/release/" -ErrorAction SilentlyContinue

          $releaseDll = Get-ChildItem -Path "gitextension/godot-cpp-template/bin" -Recurse -Filter "EXTENSION-NAME*.dll" | Where-Object { $_.Name -notlike "*.debug.dll" } | Select-Object -First 1
          $debugDll   = Get-ChildItem -Path "gitextension/godot-cpp-template/bin" -Recurse -Filter "EXTENSION-NAME*.dll" | Where-Object { $_.Name -like "*.debug.dll" }   | Select-Object -First 1

          if ($releaseDll) { Copy-Item $releaseDll.FullName "exports/release/" }
          if ($debugDll)   { Copy-Item $debugDll.FullName   "exports/debug/" }

          Compress-Archive -Path "exports/debug/*"   -DestinationPath "exports/$debugZip"   -Force
          Compress-Archive -Path "exports/release/*" -DestinationPath "exports/$releaseZip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: exports/*.zip
          body: "Automated build for MagicBalls version ${{ github.ref_name }}."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}