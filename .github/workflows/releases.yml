name: Build GDExtension, Godot Export & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# ─────────────────────────────────────────────────────────────
# JOBS – Windows, Linux and Android run in parallel,
#         release job waits for all three.
# ─────────────────────────────────────────────────────────────
jobs:

  # ───────────────────────────────────────────
  # 1) WINDOWS – C++ (CMake) + Godot export
  # ───────────────────────────────────────────
  build-windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Build C++ Library (Debug & Release)
        shell: pwsh
        run: |
          # VS generator ignores -DCMAKE_BUILD_TYPE – configuration is controlled by --config at build time.
          # One cmake -B is enough for both --config Release and --config Debug.
          # GODOT_PROJECT_DIR is relative to PROJECT_SOURCE_DIR (gitextension/godot-cpp-template/),
          # so ../../godot-code/MBEXout correctly points into godot-code/MBEXout.
          cmake -B build-cpp -S gitextension/godot-cpp-template `
            -G "Visual Studio 17 2022" -A x64 `
            -DLIBNAME="MagicBalls" `
            -DGODOT_PROJECT_DIR="../../godot-code/MBEXout"

          cmake --build build-cpp --config Release --parallel
          cmake --build build-cpp --config Debug --parallel

      - name: Rename DLLs to EXTENSION-NAME
        shell: pwsh
        run: |
          # DLLs are placed after build in godot-code/MBEXout/bin/windows/ (via CMake POST_BUILD copy)
          # and in gitextension/godot-cpp-template/bin/windows/ (primary output).
          # Rename in both locations.
          $dirs = @(
            "gitextension/godot-cpp-template/bin/windows",
            "godot-code/MBEXout/bin/windows"
          )

          foreach ($binDir in $dirs) {
            if (-not (Test-Path $binDir)) {
              Write-Host "SKIP (does not exist): $binDir"
              continue
            }
            Write-Host "=== DLLs before rename in $binDir ==="
            Get-ChildItem -Path $binDir -Filter "*.dll" | Select-Object Name

            Get-ChildItem -Path $binDir -Filter "MagicBalls*.dll" | ForEach-Object {
              $newName = $_.Name -replace '^MagicBalls', 'EXTENSION-NAME'
              Rename-Item -Path $_.FullName -NewName $newName -Force
              Write-Host "Renamed: $($_.Name) -> $newName"
            }

            Write-Host "=== DLLs after rename in $binDir ==="
            Get-ChildItem -Path $binDir -Filter "*.dll" | Select-Object Name
          }

          # Verify DLLs exist in godot-code/MBEXout (where Godot expects them)
          $targetDir = "godot-code/MBEXout/bin/windows"
          $expected = @(
            "$targetDir\EXTENSION-NAME.windows.template_debug.x86_64.debug.dll",
            "$targetDir\EXTENSION-NAME.windows.template_debug.x86_64.dll"
          )
          foreach ($f in $expected) {
            if (Test-Path $f) { Write-Host "OK: $f" }
            else              { Write-Error "MISSING: $f"; exit 1 }
          }

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true

      - name: Install Blender
        shell: pwsh
        run: |
          $url = "https://download.blender.org/release/Blender5.1/blender-5.1.0-windows-x64.msi"
          Invoke-WebRequest -Uri $url -OutFile "blender.msi"
          Start-Process msiexec -ArgumentList "/i blender.msi /quiet /norestart" -Wait
          $blenderPath = "C:\Program Files\Blender Foundation\Blender 5.1\blender.exe"
          Write-Host "Blender: $blenderPath"
          echo "BLENDER_PATH=$blenderPath" >> $env:GITHUB_ENV

      - name: Import Godot project
        shell: pwsh
        run: |
          $godotPath = $env:GODOT
          echo "GODOT_CONSOLE=$godotPath" >> $env:GITHUB_ENV
          $proj = "godot-code"

          $settingsPath = "C:\Users\runneradmin\AppData\Roaming\Godot\editor_settings-4.tres"
          $blenderDir = (Split-Path $env:BLENDER_PATH) -replace '\\', '/'
          New-Item -ItemType Directory -Force -Path (Split-Path $settingsPath)
          Set-Content $settingsPath -Encoding UTF8 -Value "[gd_resource type=""EditorSettings"" format=3]`n`n[resource]`nfilesystem/import/blender/blender3_path = ""$blenderDir"""
          Write-Host "Editor settings created with Blender path: $blenderDir"

          Write-Host "=== Running import ==="
          $proc = Start-Process -FilePath $godotPath -ArgumentList "--headless --path $proj --editor --quit-after 120000" -NoNewWindow -Wait -PassThru -RedirectStandardOutput "import_stdout.txt" -RedirectStandardError "import_stderr.txt"
          Write-Host "Exit code: $($proc.ExitCode)"
          Get-Content "import_stdout.txt" -ErrorAction SilentlyContinue
          Get-Content "import_stderr.txt" -ErrorAction SilentlyContinue

          $importedDir = "$proj/.godot/imported"
          if (Test-Path $importedDir) {
            $count = (Get-ChildItem $importedDir -Recurse -File).Count
            Write-Host "Imported files: $count"
          } else {
            Write-Error "Folder .godot/imported was not created!"
            exit 1
          }

      - name: Verify GDExtension loaded correctly
        shell: pwsh
        run: |
          # Run a GDScript that checks ClassDB for the C++ class registered by the extension.
          # Godot loads .gdextension silently even if the .dll is missing – this step makes
          # the failure explicit with a non-zero exit code.
          $script = @"
          extends SceneTree
          func _init():
              var ok = ClassDB.class_exists("MBEXclass")
              if ok:
                  print("OK: MBEXclass found in ClassDB - GDExtension loaded successfully")
                  quit(0)
              else:
                  printerr("ERROR: MBEXclass NOT found in ClassDB - extension failed to load!")
                  quit(1)
          "@
          $script | Set-Content "$env:TEMP\verify_ext.gd" -Encoding UTF8
          $godot = $env:GODOT_CONSOLE
          $proc = Start-Process -FilePath $godot `
            -ArgumentList "--headless --path godot-code --script $env:TEMP\verify_ext.gd" `
            -NoNewWindow -Wait -PassThru
          if ($proc.ExitCode -ne 0) { exit 1 }

      - name: Godot Export
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "exports/debug"
          New-Item -ItemType Directory -Force -Path "exports/release"

          $godot      = $env:GODOT_CONSOLE
          $workspace  = "${{ github.workspace }}"
          $debugExe   = "$workspace\exports\debug\MagicBalls-Debug.exe"
          $releaseExe = "$workspace\exports\release\MagicBalls.exe"

          Write-Host "=== DEBUG export ==="
          $proc = Start-Process -FilePath $godot -ArgumentList "--headless --verbose --path godot-code --export-debug Windows $debugExe" -NoNewWindow -Wait -PassThru -RedirectStandardOutput "debug_stdout.txt" -RedirectStandardError "debug_stderr.txt"
          Write-Host "Exit code: $($proc.ExitCode)"
          if (Test-Path "debug_stdout.txt") { Get-Content "debug_stdout.txt" }
          if (Test-Path "debug_stderr.txt") { Get-Content "debug_stderr.txt" }
          if ($proc.ExitCode -ne 0) { exit 1 }
          if (-not (Test-Path $debugExe)) { Write-Error "Debug exe missing!"; exit 1 }

          Write-Host "=== RELEASE export ==="
          $proc2 = Start-Process -FilePath $godot -ArgumentList "--headless --verbose --path godot-code --export-release Windows $releaseExe" -NoNewWindow -Wait -PassThru -RedirectStandardOutput "release_stdout.txt" -RedirectStandardError "release_stderr.txt"
          Write-Host "Exit code: $($proc2.ExitCode)"
          if (Test-Path "release_stdout.txt") { Get-Content "release_stdout.txt" }
          if (Test-Path "release_stderr.txt") { Get-Content "release_stderr.txt" }
          if ($proc2.ExitCode -ne 0) { exit 1 }
          if (-not (Test-Path $releaseExe)) { Write-Error "Release exe missing!"; exit 1 }

          Write-Host "=== Contents of exports/ ==="
          Get-ChildItem -Recurse "exports/"

      - name: Set version
        shell: bash
        run: |
          # Replace version
          sed -i "s|0.0.0.0|${{ github.ref_name }}|g" installer/InstallScript.iss
          cat installer/InstallScript.iss
          if grep -q "${{ github.ref_name }}" installer/InstallScript.iss; then
            echo "Set Version Passed!"
          else
            echo "Set Version Failed!"
            exit 1
          fi
          
      - name: Compile .ISS to .EXE Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer/InstallScript.iss
          options: /O+
      
      - name: Package Artifacts
        shell: pwsh
        run: |
          $tagName    = "${{ github.ref_name }}"
          $debugZip   = "exports\MagicBalls-$tagName-Windows-Debug.zip"
          $releaseZip = "exports\MagicBalls-$tagName-Windows-Release.zip"
          
          Copy-Item "scripts/editor.bat"             "exports/debug/"   -ErrorAction SilentlyContinue
          Copy-Item "scripts/removeUserMBFolder.bat" "exports/debug/"   -ErrorAction SilentlyContinue
          Copy-Item "scripts/editor.bat"             "exports/release/" -ErrorAction SilentlyContinue
          Copy-Item "scripts/removeUserMBFolder.bat" "exports/release/" -ErrorAction SilentlyContinue

          $binDir = "godot-code/MBEXout/bin/windows"
          Copy-Item "$binDir\EXTENSION-NAME.windows.template_debug.x86_64.dll"       "exports/release/"
          Copy-Item "$binDir\EXTENSION-NAME.windows.template_debug.x86_64.debug.dll" "exports/debug/"

          & "C:\Program Files\7-Zip\7z.exe" a "$debugZip"   ".\exports\debug\*"
          & "C:\Program Files\7-Zip\7z.exe" a "$releaseZip" ".\exports\release\*"
          
          Copy-Item "installer/Output/MagicBallsSetup.exe" "exports/MagicBallsSetup-$tagName.exe" -ErrorAction SilentlyContinue

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4.6.3
        with:
          name: windows-zips
          path: |
            exports/*.zip
            exports/*.exe


  # ───────────────────────────────────────────
  # 2) LINUX – C++ (CMake) + Godot export
  # ───────────────────────────────────────────
  build-linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            gcc g++ \
            libx11-dev libxcursor-dev libxinerama-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libasound2-dev libpulse-dev \
            libfreetype6-dev

      - name: Build C++ Library (Debug & Release)
        run: |
          # Patch godot-cpp CMakeLists
          GODOT_CPP_CMAKE="gitextension/godot-cpp-template/godot-cpp/CMakeLists.txt"
          sed -i 's/-fno-exceptions/-fexceptions/g' "$GODOT_CPP_CMAKE"
          sed -i 's/-fno-rtti/-frtti/g'             "$GODOT_CPP_CMAKE"
          echo "=== Patched godot-cpp CMakeLists ==="
          grep -n "exceptions\|rtti" "$GODOT_CPP_CMAKE" | head -20

          # GCC 13: -include atomic + cmath for missing transitive includes
          # -fexceptions -frtti: force exceptions (godot-cpp disables them by default)
          EXTRA_FLAGS="-include atomic -include cmath"

          cmake -B build-cpp-release -S gitextension/godot-cpp-template \
            -DCMAKE_BUILD_TYPE=Release -DLIBNAME="MagicBalls" \
            -DGODOTCPP_DISABLE_EXCEPTIONS=OFF \
            -DCMAKE_CXX_FLAGS="$EXTRA_FLAGS" \
            -GNinja
          ninja -C build-cpp-release

          cmake -B build-cpp-debug -S gitextension/godot-cpp-template \
            -DCMAKE_BUILD_TYPE=Debug -DLIBNAME="MagicBalls" \
            -DGODOTCPP_DISABLE_EXCEPTIONS=OFF \
            -DCMAKE_CXX_FLAGS="$EXTRA_FLAGS" \
            -GNinja
          ninja -C build-cpp-debug

      - name: Rename .so files to EXTENSION-NAME
        run: |
          binDir="gitextension/godot-cpp-template/bin/linux"
          destDir="godot-code/MBEXout/bin/linux"
          mkdir -p "$destDir"

          echo "=== .so files produced by CMake (before rename) ==="
          find "$binDir" -name "*.so" 2>/dev/null || echo "No .so files found!"

          # CMake on Linux produces libMagicBalls*.so (with lib prefix).
          # Handle both prefixed (libMagicBalls) and non-prefixed (MagicBalls) variants.
          for f in "$binDir"/libMagicBalls*.so "$binDir"/MagicBalls*.so; do
            [ -e "$f" ] || continue
            newName=$(basename "$f" \
              | sed 's/^libMagicBalls/libEXTENSION-NAME/' \
              | sed 's/^MagicBalls/EXTENSION-NAME/')
            mv "$f" "$binDir/$newName"
            echo "Renamed: $(basename $f) -> $newName"
          done

          # Copy directly into godot-code/MBEXout/bin/linux/ so Godot finds and bundles the .so on export.
          cp "$binDir"/libEXTENSION-NAME*.so "$destDir/" 2>/dev/null || true
          cp "$binDir"/EXTENSION-NAME*.so     "$destDir/" 2>/dev/null || true

          echo "=== .so files in godot-code/MBEXout/bin/linux/ ==="
          ls "$destDir"/*.so 2>/dev/null || { echo "ERROR: No .so files in $destDir!"; exit 1; }

      - name: Verify GDExtension .so before Godot import
        run: |
          # Fail early if the expected release .so is missing – before Godot even starts.
          EXPECTED="godot-code/MBEXout/bin/linux/MagicBalls.linux.template_debug.x86_64.so"
          if [ -f "$EXPECTED" ]; then
            echo "OK: $EXPECTED"
          else
            echo "ERROR: Expected .so not found: $EXPECTED"
            echo "=== All .so files in repo ==="
            find . -name "*.so" 2>/dev/null || echo "None found"
            exit 1
          fi

      - name: Install Godot + export templates
        run: |
          GODOT_VERSION="4.6.3"
          GODOT_FILENAME="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          TEMPLATES_FILENAME="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${GODOT_FILENAME}.zip"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${TEMPLATES_FILENAME}"

          unzip -q "${GODOT_FILENAME}.zip"
          chmod +x "${GODOT_FILENAME}"
          sudo mv "${GODOT_FILENAME}" /usr/local/bin/godot

          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q "${TEMPLATES_FILENAME}" -d /tmp/templates
          mv /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Install Blender
        run: |
          BLENDER_VERSION="5.1.0"
          wget -q "https://download.blender.org/release/Blender5.1/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          tar -xf "blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          BLENDER_PATH="$(pwd)/blender-${BLENDER_VERSION}-linux-x64/blender"
          echo "BLENDER_PATH=$BLENDER_PATH" >> $GITHUB_ENV

      - name: Import Godot project
        run: |
          SETTINGS_DIR="$HOME/.config/godot"
          mkdir -p "$SETTINGS_DIR"
          BLENDER_DIR=$(dirname "$BLENDER_PATH")
          cat > "$SETTINGS_DIR/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          filesystem/import/blender/blender3_path = "$BLENDER_DIR"
          EOF

          echo "=== Running import ==="
          timeout 120 godot --headless --path godot-code --editor --quit-after 120000 \
            > import_stdout.txt 2> import_stderr.txt || true
          cat import_stdout.txt || true
          cat import_stderr.txt || true

          if [ -d "godot-code/.godot/imported" ]; then
            COUNT=$(find "godot-code/.godot/imported" -type f | wc -l)
            echo "Imported files: $COUNT"
          else
            echo "ERROR: .godot/imported was not created!" && exit 1
          fi

      - name: Verify GDExtension loaded correctly
        run: |
          # Run a GDScript that checks ClassDB for the C++ class registered by the extension.
          # Godot loads .gdextension silently even if the .so is missing – this step makes
          # the failure explicit with a non-zero exit code.
          cat > /tmp/verify_ext.gd << 'EOF'
          extends SceneTree
          func _init():
              var ok = ClassDB.class_exists("MBEXclass")
              if ok:
                  print("OK: MBEXclass found in ClassDB - GDExtension loaded successfully")
                  quit(0)
              else:
                  printerr("ERROR: MBEXclass NOT found in ClassDB - extension failed to load!")
                  quit(1)
          EOF
          godot --headless --path godot-code --script /tmp/verify_ext.gd

      - name: Godot Export (Release)
        run: |
          mkdir -p exports/release
          RELEASE_BIN="${{ github.workspace }}/exports/release/MagicBalls.x86_64"

          echo "=== DEBUG: export_presets.cfg ==="
          cat godot-code/export_presets.cfg 2>/dev/null || echo "FILE NOT FOUND"

          echo "=== DEBUG: .so files in godot-code/MBEXout ==="
          find godot-code/MBEXout -name "*.so" 2>/dev/null || echo "none"

          echo "=== DEBUG: addons/MBEX contents ==="
          ls godot-code/addons/MBEX/ 2>/dev/null || echo "directory does not exist"

          echo "=== RELEASE export ==="
          godot --headless --verbose --path godot-code \
            --export-release Linux "$RELEASE_BIN" \
            > release_stdout.txt 2> release_stderr.txt || true
          cat release_stdout.txt || true
          cat release_stderr.txt || true

          [ -f "$RELEASE_BIN" ] || { echo "ERROR: Linux binary missing!"; exit 1; }

          echo "=== Contents of exports/ ==="
          find exports/ -type f

      - name: Package Artifacts
        run: |
          TAG="${{ github.ref_name }}"
          cp gitextension/godot-cpp-template/bin/linux/EXTENSION-NAME.linux.template_release.x86_64.so \
            exports/release/ 2>/dev/null || true

          tar -czf "exports/MagicBalls-${TAG}-Linux-Release.tar.gz" -C exports/release .

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4.6.3
        with:
          name: linux-tarballs
          path: exports/*.tar.gz


  # ───────────────────────────────────────────
  # 3) ANDROID – C++ (CMake) + Godot export (release APK)
  # ───────────────────────────────────────────
  build-android:
    name: Android (release APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3.2.1

      - name: Install Android SDK packages
        run: |
          sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Build C++ Library for Android (arm64-v8a + x86_64)
        run: |
          NDK_TOOLCHAIN="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"

          for ABI in arm64-v8a x86_64; do
            cmake -B "build-android-$ABI" \
              -S gitextension/godot-cpp-template \
              -DCMAKE_TOOLCHAIN_FILE="$NDK_TOOLCHAIN" \
              -DANDROID_ABI="$ABI" \
              -DANDROID_PLATFORM=android-24 \
              -DGODOTCPP_DISABLE_EXCEPTIONS=OFF \
              -DGODOTCPP_TARGET=template_release \
              -DCMAKE_BUILD_TYPE=Release \
              -DLIBNAME="MagicBalls" \
              -DCMAKE_EXE_LINKER_FLAGS="-lm" \
              -GNinja
            ninja -C "build-android-$ABI"
          done

      - name: Verify GDExtension .so before Godot import1
        run: |
          # Přejmenuj .so soubory – Android vyžaduje prefix "lib"
          for ABI in arm64-v8a x86_64; do
            SO_DIR="godot-code/MBEXout/bin/android.$ABI"
            for SO in "$SO_DIR"/*.so; do
              [ -f "$SO" ] || continue
              BASENAME=$(basename "$SO")
              if [[ "$BASENAME" != lib* ]]; then
                echo "Renaming: $BASENAME → lib${BASENAME}"
                mv "$SO" "$SO_DIR/lib${BASENAME}"
              fi
            done
          done

          # Ověř že soubory existují s lib prefixem
          GODOT_DIR="godot-code/MBEXout/bin"
          MISSING=0
          for EXPECTED in \
            "$GODOT_DIR/android.arm64-v8a/libMagicBalls.android.arm64-v8a.template_release.arm64.so" \
            "$GODOT_DIR/android.x86_64/libMagicBalls.android.x86_64.template_release.x86_64.so"; do
            if [ -f "$EXPECTED" ]; then
              echo "OK: $EXPECTED"
            else
              echo "ERROR: Expected .so not found: $EXPECTED"
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            echo "=== All .so files in repo ==="
            find . -name "*.so" 2>/dev/null || echo "None found"
            exit 1
          fi

      - name: Install Godot + Android export templates
        run: |
          GODOT_VERSION="4.6.3"
          GODOT_FILENAME="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          TEMPLATES_FILENAME="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${GODOT_FILENAME}.zip"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${TEMPLATES_FILENAME}"

          unzip -q "${GODOT_FILENAME}.zip"
          chmod +x "${GODOT_FILENAME}"
          sudo mv "${GODOT_FILENAME}" /usr/local/bin/godot

          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q "${TEMPLATES_FILENAME}" -d /tmp/templates
          mv /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Setup Android keystore (release signing)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          echo "KEYSTORE_PATH=$(pwd)/keystore.jks" >> $GITHUB_ENV

          KEYSTORE_SIZE=$(wc -c < keystore.jks)
          echo "Keystore size: ${KEYSTORE_SIZE} bytes"
          if [ "$KEYSTORE_SIZE" -lt 100 ]; then
            echo "ERROR: keystore.jks je příliš malý – base64 decode selhal!"
            exit 1
          fi
          keytool -list -keystore keystore.jks -storepass "$KEYSTORE_PASSWORD" -noprompt \
            && echo "OK: Keystore is valid" \
            || { echo "ERROR: Keystore neplatný nebo špatné heslo!"; exit 1; }
          # Godot editor settings for Android SDK
          SETTINGS_DIR="$HOME/.config/godot"
          mkdir -p "$SETTINGS_DIR"
          cat > "$SETTINGS_DIR/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          EOF

      - name: Import Godot project
        run: |
          timeout 120 godot --headless --path godot-code --editor --quit-after 120000 \
            > import_stdout.txt 2> import_stderr.txt || true
          cat import_stdout.txt || true
          cat import_stderr.txt || true

          if [ -d "godot-code/.godot/imported" ]; then
            COUNT=$(find "godot-code/.godot/imported" -type f | wc -l)
            echo "Imported files: $COUNT"
          else
            echo "ERROR: .godot/imported was not created!" && exit 1
          fi

      - name: Verify GDExtension loaded correctly
        run: |
          # Android .so cannot be loaded on a Linux runner – verify file existence only.
          EXPECTED="godot-code/MBEXout/bin/android.arm64-v8a/libMagicBalls.android.arm64-v8a.template_release.arm64.so"
          if [ -f "$EXPECTED" ]; then
            echo "OK: $EXPECTED"
          else
            echo "ERROR: Expected .so not found: $EXPECTED"
            exit 1
          fi

      - name: Fix scene UIDs
        run: |
          # Godot 4 uses UIDs to reference scenes/resources.
          # If .uid files are missing the main scene cannot be resolved at runtime.
          # Run a second import pass to ensure all UIDs are generated.
          echo "=== Second import pass to fix UIDs ==="
          timeout 120 godot --headless --path godot-code --editor --quit-after 120000 \
            > import2_stdout.txt 2> import2_stderr.txt || true
          cat import2_stdout.txt || true
          cat import2_stderr.txt || true
          echo "=== .uid files after second import ==="
          find godot-code -name "*.uid" | head -20 || echo "No .uid files found!"

      - name: Godot Export – Android Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          PRESETS_FILE="godot-code/export_presets.cfg"

          echo "=== Inject keystore do export_presets.cfg ==="
          sed -i "/^keystore\/release/d" "$PRESETS_FILE"
          sed -i "/^\[preset\.[0-9]*\.options\]/a keystore\/release_key_password=\"$KEY_PASSWORD\"\nkeystore\/release_password=\"$KEYSTORE_PASSWORD\"\nkeystore\/release_user=\"$KEY_ALIAS\"\nkeystore\/release=\"$KEYSTORE_PATH\"" "$PRESETS_FILE"
          echo "=== Keystore řádky v export_presets.cfg ==="
          grep -n "keystore" "$PRESETS_FILE" || echo "(zadne keystore radky!)"

          mkdir -p exports/android
          TAG="${{ github.ref_name }}"
          APK_PATH="${{ github.workspace }}/exports/android/MagicBalls-${TAG}-Android-Release.apk"

          echo "=== .so files před exportem ==="
          find godot-code/MBEXout/bin -name "*.so" | sort

          echo "=== ANDROID RELEASE export ==="
          godot --headless --verbose --path godot-code \
            --export-release Android "$APK_PATH" \
            > android_export_stdout.txt 2> android_export_stderr.txt || true
          cat android_export_stdout.txt || true
          cat android_export_stderr.txt || true

          # Godot returns exit code 1 due to memory leak on shutdown (PagedAllocator)
          # even when the APK was created successfully – check file existence instead.
          if [ -f "$APK_PATH" ]; then
            echo "=== APK CREATED SUCCESSFULLY: $APK_PATH ==="
          else
            echo "ERROR: APK does not exist - export failed."
            cat android_export_stdout.txt || true
            cat android_export_stderr.txt || true
            exit 1
          fi

      - name: Verify APK
        run: |
          TAG="${{ github.ref_name }}"
          APK_PATH="${{ github.workspace }}/exports/android/MagicBalls-${TAG}-Android-Release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "APK neexistuje!"; exit 1
          fi
          ls -lh "$APK_PATH"
          echo "=== Obsah APK (prvnich 50 polozek) ==="
          unzip -l "$APK_PATH" | head -50
          echo "=== Kontrola podpisu ==="
          unzip -l "$APK_PATH" | grep -i "META-INF" \
            && echo "OK: APK je podepsano" \
            || { echo "CHYBA: META-INF chybi - APK neni podepsano!"; exit 1; }

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4.6.3
        with:
          name: android-apk
          path: exports/android/*.apk


  # ───────────────────────────────────────────
  # 4) RELEASE – waits for all 3 builds,
  #              generates changelog via Gemini
  #              and creates GitHub Release
  # ───────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-linux
      - build-android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4.3.0
        with:
          path: dist/

      - name: List dist
        run: find dist/ -type f

      - name: Generate Changelog via Gemini
        id: changelog
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # 1. Get git log
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -z "$PREV_TAG" ]; then
            GIT_LOG=$(git log --oneline --no-merges | head -30)
          else
            GIT_LOG=$(git log "${PREV_TAG}..HEAD" --oneline --no-merges)
          fi
          [ -z "$GIT_LOG" ] && GIT_LOG="No commits since last release."

          # 2. Prepare prompt
          PROMPT="You are a concise release notes writer. Based on the following git commit log, write a short and clear changelog in bullet points (max 10 bullets). Group related changes. Commits:\n\n${GIT_LOG}"

          # 3. Call API with retry logic (10 attempts) and fallback
          RESPONSE=$(python3 -c "
          import json, requests, os, sys, time
          
          api_key = os.getenv('GEMINI_API_KEY')
          url = f'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key={api_key}'
          prompt_text = sys.argv[1]
          raw_log = sys.argv[2]
          payload = {'contents': [{'parts': [{'text': prompt_text}]}]}
          headers = {'Content-Type': 'application/json'}
          
          success = False
          for i in range(1, 11):
              try:
                  res = requests.post(url, json=payload, headers=headers, timeout=30)
                  if res.status_code == 200:
                      print(res.json()['candidates'][0]['content']['parts'][0]['text'])
                      success = True
                      break
                  elif res.status_code in [429, 503, 500]:
                      print(f'Attempt {i}/10: Server busy ({res.status_code}). Waiting...', file=sys.stderr)
                  else:
                      print(f'Attempt {i}/10: Error {res.status_code}: {res.text}', file=sys.stderr)
              except Exception as e:
                  print(f'Attempt {i}/10: Network error: {e}', file=sys.stderr)
              
              if i < 10: time.sleep(5)

          if not success:
              print('Gemini API unavailable after 10 attempts. Using raw log.', file=sys.stderr)
              print(f'### Raw Changelog\n{raw_log}')
          " "$PROMPT" "$GIT_LOG")

          # 4. Save to GitHub Actions output
          {
            echo "CHANGELOG<<EOF"
            echo "$RESPONSE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "MagicBalls ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          body: |
            ## 🎮 MagicBalls ${{ github.ref_name }}

            ${{ steps.changelog.outputs.CHANGELOG }}

            ---
            | Platforma | Soubor |
            |-----------|--------|
            | 🪟 Windows Debug | `MagicBalls-${{ github.ref_name }}-Windows-Debug.zip` |
            | 🪟 Windows Release | `MagicBalls-${{ github.ref_name }}-Windows-Release.zip` |
            | 🪟 Windows Release | `MagicBallsSetup-${{ github.ref_name }}.exe` |
            | 🐧 Linux x86_64 | `MagicBalls-${{ github.ref_name }}-Linux-Release.tar.gz` |
            | 🤖 Android | `MagicBalls-${{ github.ref_name }}-Android-Release.apk` |
          files: |
            dist/windows-zips/*.zip
            dist/windows-zips/*.exe
            dist/linux-tarballs/*.tar.gz
            dist/android-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}